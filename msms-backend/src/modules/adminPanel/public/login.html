<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SmartShop Admin</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a; color: #1e293b; margin: 0;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: #fff; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.35);
    max-width: 380px; width: 100%; padding: 40px 36px; margin: 16px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #64748b; font-size: 13px; margin: 0 0 28px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin: 0 0 6px; }
  input {
    width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid #cbd5e1;
    font-size: 14px; margin-bottom: 18px; font-family: inherit;
  }
  input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  button {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    background: #2563eb; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .error {
    background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
    border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 18px; display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>SmartShop Admin</h1>
    <p class="sub">Sign in to review and approve payments.</p>
    <div class="error" id="error"></div>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required/>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required/>
      <button type="submit" id="submitBtn">Log In</button>
    </form>
  </div>

<script>
  if (localStorage.getItem('smartshop_admin_token')) {
    window.location.href = 'dashboard.html';
  }

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('error');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    try {
      const res = await fetch('/api/admin-auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok || !data.success) {
        errorBox.textContent = data.error || 'Login failed. Please try again.';
        errorBox.style.display = 'block';
        return;
      }
      localStorage.setItem('smartshop_admin_token', data.data.token);
      window.location.href = 'dashboard.html';
    } catch (err) {
      errorBox.textContent = 'Network error. Please check your connection and try again.';
      errorBox.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
    }
  });
</script>
</body>
</html>
